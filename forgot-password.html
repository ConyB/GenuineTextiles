<!doctype html>
<!-- Prototype reset screen sharing the login layout and wording source. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loading</title>
  <link rel="stylesheet" href="assets/vendor/vendor.css">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-brand-panel" id="authBrandPanel" aria-label="Genuine Textiles introduction"></section>
    <section class="auth-form-panel" aria-label="Password reset">
      <div class="auth-card">
        <h1 id="resetHeading"></h1>
        <p class="auth-intro" id="resetIntro"></p>
        <form id="resetForm" novalidate>
          <label class="form-label" id="resetIdentifierLabel" for="resetIdentifier"></label>
          <input class="form-control" id="resetIdentifier" type="text" autocomplete="username" aria-describedby="resetError" maxlength="100" required>
          <div class="auth-error" id="resetError" role="alert"></div>
          <div class="alert alert-info mt-3 d-none" id="resetMessage" role="status"></div>
          <button class="btn btn-primary w-100 mt-3" id="resetButton" type="submit"></button>
        </form>
        <p class="text-center mt-3 mb-0"><a class="auth-link" id="returnToLogin" href="login.html"></a></p>
      </div>
    </section>
  </main>
  <!-- Only authentication dependencies, in the order required by docs/STORE_API.md. -->
  <script src="assets/vendor/vendor.js"></script>
  <script src="assets/js/core/namespace.js"></script>
  <script src="assets/js/core/schema.js"></script>
  <script src="assets/js/core/format.js"></script>
  <script src="assets/js/core/dates.js"></script>
  <script src="assets/js/core/calc.js"></script>
  <script src="assets/js/core/mock-data.js"></script>
  <script src="assets/js/core/store.js"></script>
  <script src="assets/js/core/settings.js"></script>
  <script src="assets/js/core/session.js"></script>
  <script src="assets/js/core/audit.js"></script>
  <script src="assets/js/core/reset-request-service.js"></script>
  <script src="assets/js/core/auth-page.js"></script>
  <script>
    /* A-106: record a simulated request without checking whether the account exists. */
    GT.authPage.renderBrand();
    GT.authPage.fillResetCopy();
    document.getElementById('resetForm').addEventListener('submit', function (event) {
      event.preventDefault();
      var input = document.getElementById('resetIdentifier');
      var error = document.getElementById('resetError');
      var identifier = input.value.trim();
      error.style.display = identifier ? 'none' : 'block';
      input.setAttribute('aria-invalid', identifier ? 'false' : 'true');
      if (!identifier) return;
      GT.resetRequests.request(identifier);
      document.getElementById('resetMessage').classList.remove('d-none');
    });
    document.getElementById('resetIdentifier').addEventListener('input', function () {
      document.getElementById('resetError').style.display = 'none';
      this.removeAttribute('aria-invalid');
    });
  </script>
</body>
</html>
